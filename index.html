<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cursor Processing Robot</title>
  </head>
  <body>
    <div id="app"></div>
    <div class="hud">
      <div class="brand">Goku Robot</div>
      <div class="status"><span class="dot"></span><span id="statusText">Start Ayiduchu !</span></div>
      <div class="readout">
        <div><span>Mikka Maghizchi !</span><b id="cursorReadout">0.00, 0.00</b></div>
        <div><span>Nalladhu</span><b id="distanceReadout">0.00</b></div>
        <div><span>PROCESS</span><b id="processReadout">IDLE</b></div>
      </div>
    </div>
    <div class="hint">Move your cursor — the robot tracks, scans and processes it.</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
